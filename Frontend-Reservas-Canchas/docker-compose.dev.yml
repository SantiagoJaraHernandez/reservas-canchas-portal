services:
  frontend:
    container_name: reservas-dev-frontend
    image: reservas-frontend:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - reservas-dev-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  reservas-dev-net:
    external: true
