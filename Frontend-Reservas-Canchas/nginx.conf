server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Soporte para React Router: cualquier ruta vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache liviano para archivos estáticos versionados por Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # config.js no se cachea para que cada ambiente tome su API_URL correcta
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        expires off;
        try_files $uri =404;
    }
}
